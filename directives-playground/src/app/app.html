<main class="page">
  <h1>Directives Playground</h1>
  <p class="hint">Hover the boxes to see the attribute directive in action.</p>

  <section class="grid">
    <article class="card" appHighlight>
      Default highlight (gold)
    </article>

    <article class="card" [appHighlight]="'lightskyblue'">
      Custom highlight (lightskyblue)
    </article>

    <article class="card" [appHighlight]="favoriteColor()">
      Highlight from a signal ({{ favoriteColor() }})
    </article>
  </section>
</main>
