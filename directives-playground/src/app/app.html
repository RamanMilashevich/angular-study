<main class="page">
  <h1>Directives Playground</h1>
  <p class="hint">Hover the boxes to see the attribute directives in action.</p>

  <section class="grid">
    <article class="card" appHighlight>
      Imperative (Renderer2) — default gold
    </article>

    <article class="card" [appHighlight]="'lightskyblue'">
      Imperative (Renderer2) — custom color
    </article>

    <article class="card" [appHighlight]="favoriteColor()">
      Imperative (Renderer2) — signal ({{ favoriteColor() }})
    </article>

    <article class="card" appHoverHighlight>
      Declarative (@HostBinding) — default plum
    </article>

    <article class="card" [appHoverHighlight]="'lightcoral'">
      Declarative (@HostBinding) — custom color
    </article>
  </section>
</main>
